spring:
  application:
    name: mahesh-clothes-shop

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/railway}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1500000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway manages database schema migrations.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    ignore-migration-patterns: "*:missing"
    clean-disabled: true

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

    multipart:
      max-file-size: 6MB
      max-request-size: 8MB

  web:
    resources:
      cache:
        cachecontrol:
          max-age: 7d
          cache-public: true

server:
  port: ${PORT:8080}

  forward-headers-strategy: framework

  compression:
    enabled: true
    mime-types:
      - text/html
      - text/css
      - application/javascript
      - application/json

  servlet:
    session:
      timeout: 8h
      cookie:
        name: MCS_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  health:
    db:
      enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}

  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}

  setup-token: ${APP_SETUP_TOKEN:}

  whatsapp:
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    api-version: ${WHATSAPP_API_VERSION:v23.0}

logging:
  level:
    root: INFO
    com.maheshclothes: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"