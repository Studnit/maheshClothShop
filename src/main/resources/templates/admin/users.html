<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title th:text="#{nav.users}">Users</title></head>
<body>
<th:block layout:fragment="content">
  <div class="page-head"><div><h1 th:text="#{nav.users}">Users</h1></div>
    <div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/admin/roles}"><i class="bi bi-shield-lock me-1"></i><span th:text="#{nav.roles}">Roles</span></a>
    <a class="btn btn-primary" th:href="@{/admin/users/new}"><i class="bi bi-person-plus me-1"></i><span th:text="#{admin.user.new}">Add user</span></a></div></div>
  <div class="card"><div class="table-responsive"><table class="table table-hover mb-0">
    <thead><tr><th th:text="#{admin.user.username}">Username</th><th th:text="#{col.name}">Name</th><th th:text="#{admin.user.role}">Role</th><th th:text="#{col.phone}">Phone</th><th th:text="#{admin.user.lastlogin}">Last login</th><th th:text="#{col.status}">Status</th><th></th></tr></thead>
    <tbody><tr th:each="u : ${users}">
      <td class="fw-semibold" th:text="${u.username}">u</td><td th:text="${u.fullName}">n</td><td th:text="${u.role.name}">r</td><td th:text="${u.phone}">p</td>
      <td th:text="${u.lastLoginAt != null} ? ${@fmt.dateTime(u.lastLoginAt)} : '–'">–</td>
      <td><span class="status-pill" th:classappend="${u.enabled} ? 'pill-ok' : 'pill-off'" th:text="${u.enabled} ? #{status.active} : #{status.disabled}">Active</span></td>
      <td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/users/{id}/edit(id=${u.id})}"><i class="bi bi-pencil"></i></a></td></tr></tbody></table></div></div>
</th:block>
</body>
</html>
