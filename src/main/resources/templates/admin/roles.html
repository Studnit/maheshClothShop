<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title th:text="#{nav.roles}">Roles</title></head>
<body>
<th:block layout:fragment="content">
  <div class="page-head"><div><h1 th:text="#{nav.roles}">Roles &amp; permissions</h1><div class="sub" th:text="#{admin.roles.sub}">Choose what each role can do</div></div>
    <a class="btn btn-outline-secondary" th:href="@{/admin/users}"><i class="bi bi-arrow-left me-1"></i><span th:text="#{nav.users}">Users</span></a></div>
  <div class="card mb-3" th:each="r : ${roles}"><div class="card-header fw-semibold" th:text="${r.name}">Role</div>
    <div class="card-body"><form method="post" th:action="@{/admin/roles/{id}(id=${r.id})}">
      <div class="row g-3"><div class="col-md-6 col-xl-4" th:each="g : ${groups}"><div class="fw-semibold small text-uppercase text-muted mb-1" th:text="${g.key}">Group</div>
        <div class="form-check" th:each="p : ${g.value}"><input class="form-check-input" type="checkbox" name="perm" th:value="${p.code}" th:id="${r.id + p.code}" th:checked="${r.has(p.code)}"><label class="form-check-label" th:for="${r.id + p.code}" th:text="${p.description}">p</label></div></div></div>
      <button class="btn btn-primary mt-3" type="submit" th:text="#{action.save}">Save</button></form></div></div>
</th:block>
</body>
</html>
