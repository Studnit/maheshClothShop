<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title th:text="#{stock.movements}">Stock history</title></head>
<body>
<th:block layout:fragment="content">
  <div class="page-head"><div><h1 th:text="#{stock.movements}">Stock history</h1><div class="sub" th:text="#{stock.movements.sub}">Every change to stock, newest first. Entries are never edited.</div></div></div>
  <div class="card mb-3"><div class="card-body">
    <form class="filters" method="get" th:action="@{/inventory/movements}">
      <div><label class="form-label" th:text="#{filter.from}">From</label><input class="form-control" type="date" name="from" th:value="${from}"></div>
      <div><label class="form-label" th:text="#{filter.to}">To</label><input class="form-control" type="date" name="to" th:value="${to}"></div>
      <div><label class="form-label" th:text="#{col.type}">Type</label>
        <select class="form-select" name="type"><option value="" th:text="#{filter.all}">All</option>
          <option th:each="t : ${types}" th:value="${t.name()}" th:selected="${t.name() == type}" th:text="#{'movement.' + ${t.name()}}">t</option></select></div>
      <input type="hidden" name="variant" th:value="${param.variant}">
      <div><button class="btn btn-primary" type="submit"><i class="bi bi-funnel me-1"></i><span th:text="#{filter.apply}">Apply</span></button></div>
    </form></div></div>
  <div class="card"><div class="table-responsive"><table class="table table-hover mb-0">
    <thead><tr><th th:text="#{col.time}">When</th><th th:text="#{col.product}">Product</th><th th:text="#{col.type}">Type</th><th class="text-end" th:text="#{col.change}">Change</th>
      <th class="text-end" th:text="#{col.balance}">Balance</th><th th:text="#{col.reference}">Ref</th><th th:text="#{col.reason}">Reason</th><th th:text="#{wa.col.by}">By</th></tr></thead>
    <tbody>
      <tr th:each="m : ${page.items()}">
        <td th:text="${@fmt.dateTime(m.at())}">t</td>
        <td><span th:text="${m.productName()}">p</span><small class="d-block text-muted" th:text="${@fmt.variant(m.colourName(), m.sizeName())}">c</small></td>
        <td><span class="status-pill pill-info" th:text="#{'movement.' + ${m.type()}}">SALE</span></td>
        <td class="text-end num fw-semibold" th:classappend="${m.availableDelta() + m.damagedDelta() < 0} ? 'text-danger' : 'text-success'"
            th:text="${m.availableDelta() != 0} ? (${m.availableDelta() > 0 ? '+' : ''} + ${m.availableDelta()}) : (${m.damagedDelta() > 0 ? '+' : ''} + ${m.damagedDelta()} + ' ' + #{col.damaged})">+1</td>
        <td class="text-end num" th:text="${m.availableAfter()}">0</td>
        <td class="small" th:text="${m.refNo()}">ref</td><td class="small text-muted" th:text="${m.reason()}">r</td><td class="small" th:text="${m.user()}">u</td>
      </tr>
      <tr th:if="${#lists.isEmpty(page.items())}"><td colspan="8"><div th:replace="~{fragments/ui :: empty('clock-history', 'stock.movements.empty')}"></div></td></tr>
    </tbody></table></div>
    <div th:replace="~{fragments/ui :: pager(${page})}"></div></div>
</th:block>
</body>
</html>
