<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title th:text="#{dash.adjust.stock}">Adjust stock</title></head>
<body>
<th:block layout:fragment="content">
  <div class="page-head"><div><h1 th:text="#{dash.adjust.stock}">Adjust stock</h1><div class="sub" th:text="#{stock.adjust.sub}">Opening stock, corrections, damaged items. Every change needs a reason.</div></div></div>
  <div class="row"><div class="col-lg-6"><div class="card"><form class="card-body" th:action="@{/inventory/adjust}" method="post" data-once id="adjustForm">
    <div class="mb-3 position-relative">
      <label class="form-label" th:text="#{col.product}">Item</label>
      <input type="hidden" name="variantId" id="variantId" th:value="${variant != null ? variant.variantId() : ''}" required>
      <input class="form-control" id="variantQ" autocomplete="off" th:placeholder="#{pos.search.placeholder}" th:value="${variant != null ? variant.label() : ''}">
      <div id="variantList" class="list-group position-absolute w-100 shadow d-none" style="z-index:20"></div>
      <div class="form-text" id="variantStock"></div>
    </div>
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label" th:text="#{col.type}">Type</label>
        <select class="form-select" name="type" id="adjType" required>
          <option th:each="t : ${types}" th:value="${t.name()}" th:disabled="${t.sensitive and !canApprove}" th:text="#{'adjust.type.' + ${t.name()}}">t</option></select></div>
      <div class="col-md-6"><label class="form-label" th:text="#{col.qty}">Quantity</label><input class="form-control text-end" name="quantity" type="number" min="1" required></div>
      <div class="col-md-6" id="costBox"><label class="form-label" th:text="#{stock.unit.cost}">Cost per item (₹)</label><input class="form-control text-end" name="unitCost" inputmode="decimal"></div>
      <div class="col-12"><label class="form-label" th:text="#{col.reason}">Reason</label><input class="form-control" name="reason" required maxlength="300"></div>
    </div>
    <div class="d-flex gap-2 mt-3"><button class="btn btn-primary" type="submit"><i class="bi bi-check2 me-1"></i><span th:text="#{common.save}">Save</span></button>
      <a class="btn btn-outline-secondary" th:href="@{/inventory}" th:text="#{common.cancel}">Cancel</a></div>
  </form></div></div></div>
</th:block>
<th:block layout:fragment="scripts"><script th:src="@{/js/variant-picker.js}"></script></th:block>
</body>
</html>
