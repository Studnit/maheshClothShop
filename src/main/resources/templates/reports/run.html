<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title th:text="#{'report.' + ${def.key()}}">Report</title></head>
<body>
<th:block layout:fragment="content">
  <div class="page-head"><div><h1 th:text="#{'report.' + ${def.key()}}">Report</h1><div class="sub" th:text="#{'report.' + ${def.key()} + '.desc'}">d</div></div>
    <div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/reports}"><i class="bi bi-arrow-left me-1"></i><span th:text="#{nav.reports}">Reports</span></a>
      <a class="btn btn-outline-success" th:href="@{/reports/{k}/csv(k=${def.key()}, from=${from}, to=${to})}"><i class="bi bi-filetype-csv me-1"></i><span th:text="#{report.export}">Export CSV</span></a>
      <button class="btn btn-outline-primary" type="button" data-print><i class="bi bi-printer me-1"></i><span th:text="#{action.print}">Print</span></button></div></div>
  <div class="card mb-3" th:unless="${def.range().name() == 'NONE'}"><div class="card-body"><form class="filters" method="get" th:action="@{/reports/{k}(k=${def.key()})}">
    <div><label class="form-label" th:text="#{filter.from}">From</label><input type="date" class="form-control" name="from" th:value="${from}"></div>
    <div><label class="form-label" th:text="#{filter.to}">To</label><input type="date" class="form-control" name="to" th:value="${to}"></div>
    <div><button class="btn btn-primary" type="submit"><i class="bi bi-funnel me-1"></i><span th:text="#{filter.apply}">Apply</span></button></div></form></div></div>
  <div class="card"><div class="table-responsive"><table class="table table-sm table-hover mb-0">
    <thead><tr><th th:each="c : ${def.columns()}" th:classappend="${c.type().name() != 'TEXT' and c.type().name() != 'DATE'} ? 'text-end'" th:text="#{'report.col.' + ${c.key()}}">c</th></tr></thead>
    <tbody>
      <tr th:each="row : ${result.rows()}"><td th:each="c, st : ${def.columns()}" th:with="v=${row.get(st.index)}"
          th:classappend="${c.type().name() != 'TEXT' and c.type().name() != 'DATE'} ? 'text-end'"
          th:text="${v == null} ? '' : (${c.type().name() == 'MONEY'} ? ${@fmt.money(v)} : (${c.type().name() == 'NUMBER'} ? ${@fmt.number(v)} : (${c.type().name() == 'PERCENT'} ? ${@fmt.percent(v)} : (${c.type().name() == 'DATE'} ? ${@fmt.date(v)} : ${v}))))">v</td></tr>
      <tr th:if="${#lists.isEmpty(result.rows())}"><td th:colspan="${#lists.size(def.columns())}"><div th:replace="~{fragments/ui :: empty('bar-chart', 'report.empty')}"></div></td></tr>
    </tbody>
    <tfoot th:if="${result.totals() != null}"><tr class="fw-bold"><td th:each="c, st : ${def.columns()}" th:with="v=${result.totals().get(st.index)}" class="text-end"
          th:text="${v == null} ? (${st.first} ? #{col.total} : '') : (${c.type().name() == 'MONEY'} ? ${@fmt.money(v)} : ${@fmt.number(v)})">t</td></tr></tfoot>
  </table></div></div>
</th:block>
</body>
</html>
