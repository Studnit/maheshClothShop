<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title th:text="#{nav.account}">My account</title></head>
<body>
<th:block layout:fragment="content">
  <div class="page-head"><div><h1 th:text="#{nav.account}">My account</h1><div class="sub" sec:authentication="name">user</div></div></div>
  <div class="card" style="max-width:520px"><div class="card-body"><h2 class="h6" th:text="#{account.password.title}">Change password</h2>
    <form method="post" th:action="@{/account/password}" th:object="${form}" class="vstack gap-3">
      <div><label class="form-label" th:text="#{account.password.current}">Current password</label><input class="form-control" type="password" th:field="*{current}" required autocomplete="current-password"></div>
      <div><label class="form-label" th:text="#{account.password.new}">New password</label><input class="form-control" type="password" th:field="*{password}" required minlength="8" autocomplete="new-password"></div>
      <div><label class="form-label" th:text="#{account.password.confirm}">Confirm new password</label><input class="form-control" type="password" th:field="*{confirm}" required minlength="8" autocomplete="new-password"></div>
      <div><button class="btn btn-primary" type="submit" th:text="#{action.save}">Save</button></div></form></div></div>
</th:block>
</body>
</html>
