<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title th:text="${editing} ? #{suppliers.edit} : #{suppliers.new}">Supplier</title></head>
<body>
<th:block layout:fragment="content">
  <div class="page-head"><h1 th:text="${editing} ? #{suppliers.edit} : #{suppliers.new}">Add supplier</h1></div>
  <div class="row"><div class="col-lg-7"><div class="card"><form class="card-body row g-3" th:action="${editing} ? @{/suppliers/{id}(id=${supplierId})} : @{/suppliers}" th:object="${form}" method="post" data-once>
    <div class="col-md-8"><label class="form-label" th:text="#{col.name}">Name</label><input class="form-control" th:field="*{name}" required maxlength="160"></div>
    <div class="col-md-4"><label class="form-label" th:text="#{col.phone}">Phone</label><input class="form-control" th:field="*{phone}" maxlength="20" inputmode="tel"></div>
    <div class="col-md-6"><label class="form-label">GSTIN</label><input class="form-control" th:field="*{gstin}" maxlength="15"></div>
    <div class="col-md-6"><label class="form-label" th:text="#{suppliers.opening}">Opening balance (₹ you owe)</label><input class="form-control text-end" th:field="*{openingBalance}" inputmode="decimal"></div>
    <div class="col-12"><label class="form-label" th:text="#{col.address}">Address</label><input class="form-control" th:field="*{address}" maxlength="300"></div>
    <div class="col-12"><label class="form-label" th:text="#{col.notes}">Notes</label><textarea class="form-control" rows="2" th:field="*{notes}" maxlength="500"></textarea></div>
    <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" th:field="*{active}" id="active"><label class="form-check-label" for="active" th:text="#{status.active}">Active</label></div></div>
    <div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit" th:text="#{common.save}">Save</button><a class="btn btn-outline-secondary" th:href="@{/suppliers}" th:text="#{common.cancel}">Cancel</a></div>
  </form></div></div></div>
</th:block>
</body>
</html>
